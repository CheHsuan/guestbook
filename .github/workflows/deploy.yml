name: Deploy to Firebase

on:
  release:
    types: [published]

jobs:
  preview:
    name: Deploy Hosting to Preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Authenticate
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GUESTBOOK_3C7EB }}

      - name: Write runtime config
        env:
          TENOR_API_KEY: ${{ secrets.TENOR_API_KEY }}
        run: |
          node -e "require('fs').writeFileSync('public/config.js', 'window.TENOR_API_KEY = ' + JSON.stringify(process.env.TENOR_API_KEY || '') + ';\n')"

      - name: Deploy Hosting to Preview Channel
        run: npx -y firebase-tools hosting:channel:deploy preview-${{ github.event.release.tag_name }} --expires 1d

  live:
    name: Deploy Hosting and Database to Live
    runs-on: ubuntu-latest
    needs: [preview]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Authenticate
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GUESTBOOK_3C7EB }}

      - name: Write runtime config
        env:
          TENOR_API_KEY: ${{ secrets.TENOR_API_KEY }}
        run: |
          node -e "require('fs').writeFileSync('public/config.js', 'window.TENOR_API_KEY = ' + JSON.stringify(process.env.TENOR_API_KEY || '') + ';\n')"

      - name: Deploy Hosting and Database Rules
        run: npx -y firebase-tools deploy --only hosting,database
