<svg viewBox="0 0 820 560" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, sans-serif" font-size="12">
  <title>GitHub Label State Diagram</title>
  <desc>Issue 和 PR 的 label 狀態流程圖</desc>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#b60205"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0e8a16"/>
    </marker>
  </defs>

  <style>
    text { fill: #1a1a1a; font-family: system-ui, sans-serif; }
    .bg { fill: #f6f8fa; }
    .box { stroke: #d0d7de; stroke-width: 1.5; }
    .box-fill-blue   { fill: #ddf4ff; }
    .box-fill-gray   { fill: #f6f8fa; }
    .box-fill-red    { fill: #ffebe9; }
    .box-fill-green  { fill: #dafbe1; }
    .box-fill-purple { fill: #f0e6ff; }
    .box-fill-orange { fill: #fff3cd; }
    .edge       { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .edge-red   { stroke: #b60205; stroke-width: 1.5; fill: none; }
    .edge-green { stroke: #0e8a16; stroke-width: 1.5; fill: none; }
    .section-label { font-size: 10px; font-weight: 600; fill: #8c959f; letter-spacing: 0.5px; }
    .node-title { font-size: 11px; font-weight: 700; }
    .node-sub   { font-size: 10px; fill: #57606a; }
  </style>

  <rect class="bg" width="820" height="560" rx="8"/>

  <text x="30"  y="28" class="section-label">ISSUE LIFECYCLE</text>
  <text x="470" y="28" class="section-label">PR LIFECYCLE</text>
  <line x1="450" y1="15" x2="450" y2="545" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ── ISSUE SIDE ── -->
  <rect x="30" y="40" width="120" height="44" rx="6" class="box box-fill-gray"/>
  <text x="90" y="58"  text-anchor="middle" class="node-title">New Issue</text>
  <text x="90" y="72"  text-anchor="middle" class="node-sub">created</text>

  <rect x="30" y="130" width="120" height="44" rx="6" class="box box-fill-blue"/>
  <text x="90" y="148" text-anchor="middle" class="node-title">ready-for-dev</text>
  <text x="90" y="162" text-anchor="middle" class="node-sub">+ priority label</text>

  <rect x="30" y="230" width="120" height="44" rx="6" class="box box-fill-blue"/>
  <text x="90" y="248" text-anchor="middle" class="node-title">in-progress</text>
  <text x="90" y="262" text-anchor="middle" class="node-sub">agent working</text>

  <rect x="200" y="230" width="130" height="44" rx="6" class="box box-fill-red"/>
  <text x="265" y="248" text-anchor="middle" class="node-title">needs-clarification</text>
  <text x="265" y="262" text-anchor="middle" class="node-sub">awaiting human</text>

  <rect x="30" y="330" width="120" height="44" rx="6" class="box box-fill-purple"/>
  <text x="90" y="348" text-anchor="middle" class="node-title">feature-spec</text>
  <text x="90" y="362" text-anchor="middle" class="node-sub">spec ready</text>

  <rect x="30" y="430" width="120" height="44" rx="6" class="box box-fill-green"/>
  <text x="90" y="448" text-anchor="middle" class="node-title">Closed</text>
  <text x="90" y="462" text-anchor="middle" class="node-sub">PR merged</text>

  <line x1="90" y1="84"  x2="90" y2="130" class="edge" marker-end="url(#arr)"/>
  <text x="96" y="112" class="node-sub">human/agent</text>

  <line x1="90" y1="174" x2="90" y2="230" class="edge" marker-end="url(#arr)"/>
  <text x="96" y="212" class="node-sub">agent picks up</text>

  <line x1="150" y1="252" x2="200" y2="252" class="edge-red" marker-end="url(#arr-red)"/>
  <text x="154" y="246" class="node-sub" style="fill:#b60205">unclear</text>

  <path d="M 265,274 Q 390,274 390,152 Q 390,130 150,130" class="edge" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="318" y="215" class="node-sub">human clarifies</text>
  <text x="318" y="227" class="node-sub">→ ready-for-dev</text>

  <line x1="90" y1="274" x2="90" y2="330" class="edge" marker-end="url(#arr)"/>
  <text x="96" y="312" class="node-sub">writes spec</text>

  <line x1="90" y1="374" x2="90" y2="430" class="edge" marker-end="url(#arr)"/>
  <text x="96" y="412" class="node-sub">PR merged</text>

  <!-- ── PR SIDE ── -->
  <rect x="470" y="40"  width="130" height="44" rx="6" class="box box-fill-gray"/>
  <text x="535" y="58"  text-anchor="middle" class="node-title">PR Opened</text>
  <text x="535" y="72"  text-anchor="middle" class="node-sub">CI starts</text>

  <rect x="650" y="40"  width="140" height="44" rx="6" class="box box-fill-purple"/>
  <text x="720" y="55"  text-anchor="middle" class="node-title">needs-human-</text>
  <text x="720" y="69"  text-anchor="middle" class="node-title">approval</text>

  <rect x="470" y="130" width="130" height="44" rx="6" class="box box-fill-gray"/>
  <text x="535" y="148" text-anchor="middle" class="node-title">Tests (Jest)</text>
  <text x="535" y="162" text-anchor="middle" class="node-sub">npm test</text>

  <rect x="650" y="130" width="140" height="44" rx="6" class="box box-fill-orange"/>
  <text x="720" y="148" text-anchor="middle" class="node-title">fix-attempt-1/2/3</text>
  <text x="720" y="162" text-anchor="middle" class="node-sub">auto-fix running</text>

  <rect x="470" y="230" width="130" height="44" rx="6" class="box box-fill-blue"/>
  <text x="535" y="248" text-anchor="middle" class="node-title">claude-review</text>
  <text x="535" y="262" text-anchor="middle" class="node-sub">AI code review</text>

  <rect x="650" y="230" width="140" height="44" rx="6" class="box box-fill-orange"/>
  <text x="720" y="248" text-anchor="middle" class="node-title">review-fix-attempt</text>
  <text x="720" y="262" text-anchor="middle" class="node-sub">1/2/3</text>

  <rect x="470" y="330" width="130" height="44" rx="6" class="box box-fill-green"/>
  <text x="535" y="348" text-anchor="middle" class="node-title">LGTM</text>
  <text x="535" y="362" text-anchor="middle" class="node-sub">approved</text>

  <rect x="650" y="330" width="140" height="44" rx="6" class="box box-fill-red"/>
  <text x="720" y="348" text-anchor="middle" class="node-title">human-in-the-loop</text>
  <text x="720" y="362" text-anchor="middle" class="node-sub">3 attempts failed</text>

  <rect x="470" y="430" width="130" height="44" rx="6" class="box box-fill-green"/>
  <text x="535" y="448" text-anchor="middle" class="node-title">Merged</text>
  <text x="535" y="462" text-anchor="middle" class="node-sub">auto or manual</text>

  <line x1="600" y1="62"  x2="650" y2="62"  class="edge" marker-end="url(#arr)"/>
  <text x="606" y="56" class="node-sub">label set</text>

  <line x1="535" y1="84"  x2="535" y2="130" class="edge" marker-end="url(#arr)"/>

  <line x1="600" y1="152" x2="650" y2="152" class="edge-red" marker-end="url(#arr-red)"/>
  <text x="606" y="146" class="node-sub" style="fill:#b60205">fail</text>

  <path d="M 720,174 L 720,210 L 610,210 L 610,230" class="edge" marker-end="url(#arr)"/>
  <text x="648" y="208" class="node-sub">fixed → retry</text>

  <line x1="720" y1="174" x2="720" y2="330" class="edge-red" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="726" y="270" class="node-sub" style="fill:#b60205">3× fail</text>

  <line x1="535" y1="174" x2="535" y2="230" class="edge-green" marker-end="url(#arr-green)"/>
  <text x="541" y="212" class="node-sub" style="fill:#0e8a16">pass</text>

  <line x1="600" y1="252" x2="650" y2="252" class="edge-red" marker-end="url(#arr-red)"/>
  <text x="606" y="246" class="node-sub" style="fill:#b60205">changes</text>

  <path d="M 720,274 L 720,300 L 610,300 L 610,330" class="edge" marker-end="url(#arr)"/>
  <text x="648" y="298" class="node-sub">fixed → retry</text>

  <line x1="720" y1="274" x2="720" y2="330" class="edge-red" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>

  <line x1="535" y1="274" x2="535" y2="330" class="edge-green" marker-end="url(#arr-green)"/>
  <text x="541" y="312" class="node-sub" style="fill:#0e8a16">LGTM</text>

  <line x1="535" y1="374" x2="535" y2="430" class="edge-green" marker-end="url(#arr-green)"/>
  <text x="541" y="412" class="node-sub" style="fill:#0e8a16">auto-merge</text>

  <path d="M 720,84 L 760,84 L 760,452 L 600,452" class="edge" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="764" y="195" class="node-sub" style="fill:#5319e7">skip review</text>
  <text x="764" y="207" class="node-sub" style="fill:#5319e7">human merges</text>

  <!-- Legend -->
  <rect x="30" y="500" width="760" height="44" rx="6" fill="none" stroke="#d0d7de" stroke-width="1"/>
  <text x="46" y="518" class="section-label">LEGEND</text>
  <rect x="46"  y="526" width="12" height="12" rx="2" class="box-fill-blue"   stroke="#d0d7de" stroke-width="1"/><text x="64"  y="537" class="node-sub">Agent flow</text>
  <rect x="140" y="526" width="12" height="12" rx="2" class="box-fill-orange" stroke="#d0d7de" stroke-width="1"/><text x="158" y="537" class="node-sub">Auto-fix attempt</text>
  <rect x="270" y="526" width="12" height="12" rx="2" class="box-fill-red"    stroke="#d0d7de" stroke-width="1"/><text x="288" y="537" class="node-sub">Needs human</text>
  <rect x="380" y="526" width="12" height="12" rx="2" class="box-fill-green"  stroke="#d0d7de" stroke-width="1"/><text x="398" y="537" class="node-sub">Success / merged</text>
  <rect x="498" y="526" width="12" height="12" rx="2" class="box-fill-purple" stroke="#d0d7de" stroke-width="1"/><text x="516" y="537" class="node-sub">Human approval required</text>
  <line x1="654" y1="532" x2="682" y2="532" stroke="#0e8a16" stroke-width="1.5" marker-end="url(#arr-green)"/><text x="688" y="537" class="node-sub">Happy path</text>
  <line x1="654" y1="545" x2="682" y2="545" stroke="#b60205" stroke-width="1.5" marker-end="url(#arr-red)"/><text x="688" y="550" class="node-sub">Error path</text>
</svg>
